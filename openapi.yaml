openapi: 3.0.3
info:
  title: Industrial Incident Intelligence API
  version: 1.0.0
  description: API REST para la gestión y análisis de incidentes de seguridad industrial.
paths:
  /api/v1/health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK de funcionamiento del servicio
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/v1/incidents:
    get:
      summary: Listar incidentes paginados con filtros
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: sector
          in: query
          schema:
            type: string
        - name: severity_level
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Lista de incidentes
  /api/v1/analytics/summary:
    get:
      summary: Resumen analítico de incidentes
      responses:
        '200':
          description: Métricas agregadas y totales
