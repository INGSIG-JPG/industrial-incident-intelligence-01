openapi: 3.0.3
info:
  title: Industrial Incident Intelligence API
  version: 1.0.0
  description: API REST para la gestión y análisis de incidentes de seguridad industrial.
paths:
  /api/v1/health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK
  /api/v1/incidents:
    get:
      summary: Listar incidentes paginados
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de incidentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incident'
components:
  schemas:
    Incident:
      type: object
      properties:
        incident_id:
          type: string
        date:
          type: string
          format: date
        severity_level:
          type: integer
        sector:
          type: string
        days_lost:
          type: integer
        description:
          type: string
        corrective_action_taken:
          type: string
